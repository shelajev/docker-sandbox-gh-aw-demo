name: Hosted runner KVM probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Report virtualization support
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          uname -m
          grep -Eoc '(vmx|svm)' /proc/cpuinfo || true
          lsmod | grep '^kvm' || true
          ls -l /dev/kvm || true
          sudo -n true

          if [[ ! -c /dev/kvm ]]; then
            echo '::error::This hosted runner does not expose /dev/kvm.'
            exit 1
          fi

          if [[ ! -w /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
          fi

          test -w /dev/kvm
          echo 'Hosted runner exposes writable KVM; a docker-sbx trial is possible but unsupported by GitHub.'
